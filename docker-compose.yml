version: '3.8'

services:

  web:
    build: ./apache
    env_file:
      - .env
    container_name: bienesraices
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    networks:
      - app-networkphp
  db:
    image: mariadb:10.6
    container_name: bienesraices_mvc
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS_ROOT}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}

    ports:
      - "3306:3306"
    volumes:
      - .www:/var/lib/mysql
      - ./www/schema:/docker-entrypoint-initdb.d
    networks:
      - app-networkphp
  
  node:
    image: node:20
    container_name: node_app
    working_dir: /var/www/html
    volumes:
      - ./www:/var/www/html
    ports:
      - "3001:3000"
    command: npm run dev

volumes:
  db_data:

networks:
  app-networkphp:


